name: Unzip PWA files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unzip PWA files into repo root
        run: |
          set -e
          unzip -o mis-gastos-hogar-pwa.zip -d pwa_extracted
          rm -rf pwa_extracted/__MACOSX
          find pwa_extracted -name '.DS_Store' -delete
          shopt -s dotglob nullglob
          entries=(pwa_extracted/*)
          if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
            mv "${entries[0]}"/* .
          else
            mv pwa_extracted/* .
          fi
          rm -rf pwa_extracted mis-gastos-hogar-pwa.zip
          echo 'Root contents:'
          ls -la

      - name: Commit extracted files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add PWA website files' || echo 'Nothing to commit'
          git push
