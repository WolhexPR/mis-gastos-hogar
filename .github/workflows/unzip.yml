name: Unzip PWA build

on:
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Unzip build into repo root and remove temp files
        run: |
          unzip -o mis-gastos-hogar-pwa.zip -d .
          rm -f mis-gastos-hogar-pwa.zip
          rm -f .github/workflows/unzip.yml
      - name: Commit updated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update site files to new PWA build" || echo "No changes to commit"
          git push
